<html lang="en">

<meta charset="utf-8">
<title>AI Warlords — Live Chronicle (MOCKUP · Age of Empires style)</title>
<style>
  :root {
    --gold:#e8c15a; --gold-dim:#8a6d2f; --ink:#f0e8d4; --dim:#b8ab8a;
    --stone1:#33383f; --stone2:#22262c; --stone3:#171b20;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; color:var(--ink); font:14px/1.45 system-ui,sans-serif;
    background:#0b0d10 radial-gradient(1200px 600px at 50% 0%, #1a2027, #0b0d10);
    display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  .display { font-family:Georgia,'Palatino Linotype','Times New Roman',serif; letter-spacing:2px; }
  .ribbon { background:repeating-linear-gradient(45deg,#3a2f10,#3a2f10 12px,#241f0a 12px,#241f0a 24px);
    color:var(--gold); text-align:center; padding:3px; font-size:11px; letter-spacing:2px; flex:none; }
  .topbar { display:flex; align-items:center; justify-content:center; gap:14px; padding:6px 12px;
    background:linear-gradient(#3a4048,#23272e); border-bottom:3px double var(--gold-dim); flex-wrap:wrap; flex:none; }
  .realm { font-size:18px; color:var(--gold); }
  .resbar { display:flex; gap:0; background:#101318; border:2px solid var(--gold-dim); border-radius:8px; overflow:hidden; }
  .resbar span { padding:5px 12px; border-left:1px solid #3a3f47; white-space:nowrap; }
  .resbar span:first-child { border-left:none; }
  .resbar b { color:var(--gold); }
  .age { background:#3d2f12; border:2px solid var(--gold-dim); border-radius:8px; padding:5px 12px; color:var(--gold); }
  .sbtn { background:linear-gradient(#4a5058,#2c3138); color:var(--ink); border:2px solid var(--gold-dim);
    border-radius:8px; padding:4px 12px; cursor:pointer; font-family:inherit; }
  .sbtn:hover { border-color:var(--gold); color:var(--gold); }
  .sbtn.on { background:var(--gold); color:#171204; font-weight:700; }
  .links a { color:var(--dim); font-size:12px; margin-left:8px; }
  /* ── Live transport ── */
  .transport { display:flex; align-items:center; gap:8px; padding:6px 14px;
    background:#141920; border-bottom:2px solid var(--gold-dim); flex-wrap:wrap; flex:none; }
  .live { display:inline-flex; align-items:center; gap:6px; font-weight:800; color:#ff6b6b; letter-spacing:2px; }
  .live i { width:10px; height:10px; border-radius:50%; background:#ff3b3b; animation:blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .tbtn { background:linear-gradient(#4a5058,#2c3138); color:var(--ink); border:2px solid var(--gold-dim);
    border-radius:8px; padding:3px 12px; cursor:pointer; font-size:15px; font-family:inherit; }
  .tbtn:hover { border-color:var(--gold); }
  #speed { background:#101318; color:var(--gold); border:2px solid var(--gold-dim); border-radius:8px; padding:3px 6px; font-family:inherit; }
  .progress { flex:1; min-width:200px; height:14px; background:#0a0d13; border:1px solid var(--gold-dim);
    border-radius:7px; position:relative; cursor:pointer; }
  .progress .fill { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,#7a5f1e,var(--gold));
    border-radius:6px; width:0; }
  .progress .stop { position:absolute; top:-3px; width:3px; height:18px; background:#4a5058; }
  .progress .stop.done { background:var(--gold); }
  #nowplay { color:var(--dim); font-size:12px; min-width:180px; }
  /* ── Isometric arena ── */
  .arena { flex:1; min-height:300px; position:relative; margin:8px 10px 0;
    border:3px double var(--gold-dim); border-radius:6px; overflow:hidden; background:#05070a; }
  #iso { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:pointer; }
  #floatlayer { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .floater { position:absolute; transform:translate(-50%,-100%); font:bold 15px Georgia,serif;
    color:var(--gold); text-shadow:0 2px 3px #000, 0 0 8px #000; white-space:nowrap;
    animation:rise 1.5s ease-out forwards; }
  .floater.big { font-size:19px; color:#ffe9a8; }
  @keyframes rise { 0% { opacity:0; margin-top:10px; } 15% { opacity:1; } 100% { opacity:0; margin-top:-46px; } }
  #herald { position:absolute; left:10px; bottom:8px; max-width:60%; background:rgba(10,12,16,.82);
    border:1px solid var(--gold-dim); border-radius:8px; padding:4px 12px; font:italic 13px Georgia,serif;
    color:var(--gold); pointer-events:none; }
  #tooltip { position:fixed; z-index:50; background:rgba(10,12,16,.92); border:1px solid var(--gold-dim);
    border-radius:6px; padding:4px 10px; font:12px system-ui,sans-serif; color:var(--ink);
    pointer-events:none; max-width:240px; }
  #mini { position:absolute; top:8px; right:8px; border:2px solid var(--gold-dim); border-radius:6px;
    background:#0a0c10; cursor:crosshair; z-index:5; }
  #cmdBanner { position:absolute; top:8px; left:50%; transform:translateX(-50%); background:rgba(40,20,10,.88);
    border:2px solid var(--gold); border-radius:8px; padding:4px 14px; font:bold 13px Georgia,serif;
    color:#ffe9a8; pointer-events:none; white-space:nowrap; z-index:5; }
  #cmdbar { position:absolute; right:10px; bottom:8px; display:flex; gap:6px; z-index:5; }
  #cmdbar[hidden] { display:none; }
  #cmdAttack.armed { border-color:#ff5a4e; color:#ffb4b4; }
  .order.local { border-color:var(--gold); }
  .order.local .n { background:var(--gold); color:#141414; }
  #toast { position:absolute; right:10px; bottom:52px; max-width:46%; background:rgba(10,12,16,.9);
    border:2px solid var(--gold-dim); border-radius:8px; padding:6px 12px; font:bold 13px system-ui,sans-serif;
    pointer-events:none; z-index:5; }
  #statusline { font-size:12px; color:var(--dim); padding:5px 14px 0; flex:none; }
  #statusline b { color:var(--ink); }
  /* ── Dock ── */
  .dock { display:grid; grid-template-columns:190px minmax(0,1fr) 320px; gap:8px; padding:6px 10px 8px; flex:none; }
  .stone { background:linear-gradient(#2e333b,#1d2126); border:3px double var(--gold-dim);
    border-radius:8px; padding:8px; min-height:0; }
  .stone h4 { margin:0 0 6px; color:var(--gold); font-size:12px; letter-spacing:2px; }
  .tabs { display:flex; gap:6px; margin-bottom:6px; }
  .tabs button { flex:1; background:#101318; color:var(--dim); border:2px solid #3a3f47;
    border-radius:6px; padding:5px; cursor:pointer; font-family:Georgia,serif; letter-spacing:1px; }
  .tabs button.on { color:var(--gold); border-color:var(--gold-dim); }
  .card { background:#101318; border:1px solid #3a3f47; border-radius:6px; padding:6px 8px; margin-bottom:6px; }
  .card h5 { margin:0 0 4px; color:var(--gold); font-size:11px; letter-spacing:2px; }
  .brow { display:flex; justify-content:space-between; align-items:center; padding:3px 0; border-top:1px dotted #3a3f47; font-size:13px; }
  .brow:first-of-type { border-top:none; }
  .brow.now { background:#2a2410; margin:0 -8px; padding:3px 8px; }
  .cost { color:var(--dim); font-size:12px; }
  .afford { color:#7fd08f; } .poor { color:#e07f7f; }
  .qbar { height:8px; background:#2c3138; border-radius:4px; overflow:hidden; margin-top:3px; }
  .qbar i { display:block; height:100%; background:var(--gold); transition:width .8s ease; }
  .log { max-height:150px; overflow:auto; font-size:12px; }
  .log div { padding:2px 0; border-top:1px dotted #3a3f47; }
  .log .t { color:var(--dim); }
  .log div.fresh { animation:flash 1.6s ease; }
  @keyframes flash { 0% { background:#4a3f14; } 100% { background:transparent; } }
  .orders { max-height:168px; overflow:auto; }
  .order { display:flex; gap:8px; align-items:center; width:100%; text-align:left; background:#101318;
    color:var(--dim); border:1px solid #3a3f47; border-radius:6px; padding:4px 8px; margin-bottom:4px;
    cursor:pointer; font:12px system-ui,sans-serif; }
  .order:hover { border-color:var(--gold); color:var(--ink); }
  .order.done { color:var(--ink); }
  .order.done .n { background:#2c4a2c; border-color:#57a773; color:#cfd; }
  .order.now { border-color:var(--gold); background:#2a2410; color:var(--gold); }
  .order .n { background:#2c3138; border:1px solid #3a3f47; border-radius:4px; padding:0 6px; font-weight:700; }
  .fine { color:var(--dim); font-size:11px; padding:0 12px 8px; flex:none; }
  a { color:var(--gold); }
</style>
</head>

  <div class="progress" id="prog"><div class="fill" id="fill"></div></div>
  <span id="nowplay"></span>
</div>
<div class="arena" id="arena">

    <button class="tbtn" id="cmdHouse" title="build a house">🏠 House</button>
    <button class="tbtn" id="cmdTower" title="build a tower">🗼 Tower</button>
    <button class="tbtn" id="cmdStorage" title="build storage">📦 Storage</button>
    <button class="tbtn" id="cmdWait" title="wait: spend a prompt, do nothing">⏳ Wait</button>
    <button class="tbtn" id="cmdUpgrade" title="upgrade the city">⬆ Upgrade</button>
  </div>
  <div id="toast" hidden></div>
  <div id="tooltip" hidden></div>
</div>
<div id="statusline"></div>
<div class="dock">
  <div class="stone"><h4 class="display">🗺 Minimap</h4>
    <div style="font-size:11px;color:var(--dim);margin-top:4px" id="pop"></div></div>
  <div class="stone">
    <div class="tabs">
      <button data-tab="cell" class="on">Selected</button><button data-tab="build">Build</button>

    </div>
    <div id="tab-cell"></div><div id="tab-build" hidden></div>
    <div id="tab-city" hidden></div><div id="tab-log" hidden></div>
  </div>
  <div class="stone"><h4 class="display">📜 Orders (real dispatches — click to seek)</h4>
    <div class="orders" id="orders"></div>
  </div>
</div>

    }
    $('mini').innerHTML = mh;
    document.querySelectorAll('#orders .order').forEach((d) => {
      const k = Number(d.dataset.k);
      d.classList.toggle('now', k === r);
      d.classList.toggle('done', k < r);
    });
  }

  // ── Wiring ──
  const prog = $('prog');
  function buildStops() {
    prog.querySelectorAll('.stop').forEach((d) => d.remove());
    for (let i = 1; i < N; i++) {
      const d = document.createElement('div');
      d.className = 'stop'; d.style.left = (100 * i / (N - 1)) + '%';
      d.title = `#${i} ${(S.outcomes[i - 1] && S.outcomes[i - 1].summary) || ''}`;
      prog.appendChild(d);
    }
  }
  buildStops();
  prog.addEventListener('click', (ev) => {
    const rect = prog.getBoundingClientRect();
    const at = Math.round((ev.clientX - rect.left) / rect.width * (N - 1));
    pos = clamp(at, 0, N - 1);
    firedRev = rev();
    $('nowplay').textContent = pos === 0 ? '' : `#${rev()} ${(S.outcomes[rev() - 1] && S.outcomes[rev() - 1].summary) || ''}`;
    renderPanels();
  });
  function buildOrders() {
    const ordersEl = $('orders');
    ordersEl.innerHTML = '';
    S.outcomes.forEach((o, k) => {
      const b = document.createElement('button');
      b.className = 'order' + (o.local ? ' local' : ''); b.dataset.k = String(k + 1);
      b.innerHTML = `<span class="n">${k + 1}</span><span>${esc(o.summary || o.reason || o.status)} <span class="cost">· ${o.status}</span></span>`;
      b.addEventListener('click', () => {
        pos = Math.min(k + 1, N - 1); firedRev = rev();
        $('nowplay').textContent = `#${k + 1} ${esc(o.summary || '')}`;
        renderPanels();
      });
      ordersEl.appendChild(b);
    });
  }
  buildOrders();
  function pick(ev) {
    const rect = canvas.getBoundingClientRect();
    const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    const rr = Math.round((my - view.oy) / (view.s * 1.5 * SQUASH));
    if (rr < 0 || rr >= H) return -1;
    const cc = Math.round((mx - view.ox) / (view.s * SQ3) - 0.5 * (rr & 1));
    if (cc < 0 || cc >= W) return -1;
    const [x, y] = center(cc, rr);
    return Math.hypot(mx - x, my - y) < view.s * 1.05 ? idx(cc, rr) : -1;
  }
  canvas.addEventListener('click', (ev) => {
    const i = pick(ev); if (i < 0) return;
    sel = i;
    if (CMD) {
      const st = kf(rev());
      const unitsHere = (st.units ? st.units.units : []).filter((u) => idx(u.col, u.row) === i);
      if (unitsHere.length > 0) {
        const clicked = unitsHere[0];
        const me = selUnit ? ((st.units && st.units.units) || []).find((x) => x.id === selUnit) : null;
        if (me && clicked.owner !== me.owner && clicked.hp > 0 && me.hp > 0) {
          if (cmdDispatch(me.owner, 'unit.attack', { id: selUnit, target: clicked.id }) === 'applied') disarmAttack(true);
        }
        else { selUnit = clicked.id; toast(`${selUnit} selected — tile: march · enemy: attack`, false); }
      }
      else if (selUnit) {
        const u = (st.units.units).find((x) => x.id === selUnit);
        if (u) cmdDispatch(u.owner, 'unit.move', { id: selUnit, col: i % W, row: Math.floor(i / W) });
      }
    }
    renderPanels();
  });
  canvas.addEventListener('mousemove', (ev) => {
    hov = pick(ev);
    if (CMD && selUnit && hov >= 0) {
      const st = kf(rev());
      const us = (st.units && st.units.units) || [];
      const uh = us.find((u) => idx(u.col, u.row) === hov);
      const me = us.find((u) => u.id === selUnit);
      canvas.style.cursor = (uh && me && uh.owner !== me.owner && uh.hp > 0) ? 'crosshair' : uh ? 'pointer' : 'default';
    } else canvas.style.cursor = 'default';
    moveTooltip(ev);
  });
  canvas.addEventListener('mouseleave', () => { hov = -1; $('tooltip').hidden = true; });
  canvas.addEventListener('contextmenu', (ev) => { if (ev && ev.preventDefault) ev.preventDefault(); disarmAttack(); });
  window.addEventListener('keydown', (e) => { if (e && e.key === 'Escape') disarmAttack(); });
  $('tPlay').addEventListener('click', () => {
    if (!playing && pos >= N - 1) { pos = 0; firedRev = 0; }
    playing = !playing;
    $('tPlay').textContent = playing ? '⏸' : '▶';
  });
  $('tStart').addEventListener('click', () => { pos = 0; firedRev = 0; $('nowplay').textContent = ''; renderPanels(); });
  $('tBack').addEventListener('click', () => {
    const atRest = frac() === 0;
    pos = atRest ? Math.max(0, Math.floor(pos) - 1) : Math.floor(pos);
    firedRev = rev(); renderPanels();
  });
  $('tFwd').addEventListener('click', () => {
    playing = false; $('tPlay').textContent = '▶';
    pos = Math.min(N - 1, Math.floor(pos) + 1); firedRev = rev();
    const r = rev();
    if (r > 0) $('nowplay').textContent = `#${r} ${(S.outcomes[r - 1] && S.outcomes[r - 1].summary) || ''}`;
    renderPanels();
  });
  $('speed').addEventListener('change', (ev) => { speed = Number(ev.target.value); });
  $('tMute').addEventListener('click', () => {
    muted = !muted;
    $('tMute').textContent = muted ? '🔇' : '🔊';
    if (ambientGain) ambientGain.gain.value = muted ? 0 : 0.1;
    if (!muted) sfx('click');
  });
  for (const id of ['tPlay', 'tStart', 'tBack', 'tFwd']) $(id).addEventListener('click', () => sfx('click'));
  $('tRain').addEventListener('click', () => {
    raining = !raining;
    $('tRain').style.borderColor = raining ? '#7fb2e5' : '';
    if (raining) burst(600, 100, 12, ['#7fb2e5', '#bcd2e8'], 60, 0.8, 300, 3, false);
    sfx('click');
  });
  function rebuildThreat(vis, r) {
    THREAT.clear(); THREAT_CELLS.clear();
    const E = EE();
    if (!E) return;
    const st = kf(r);
    const us = (st.units && st.units.units) || [];
    const seenIdx = (u) => !fog || vis.has(idx(u.col, u.row));
    const adj = (a, b) => E.neighborsOf(st.map, a.col, a.row).some((c) => c.col === b.col && c.row === b.row);
    for (const u of us) {
      if (u.hp <= 0 || !seenIdx(u)) continue;
      for (const v of us) {
        if (v === u || v.owner === u.owner || v.hp <= 0 || !seenIdx(v)) continue;
        if (adj(u, v)) { THREAT.add(u.id); THREAT.add(v.id); }
      }
    }
    for (const v of us) {
      if (v.owner === 'p1' || v.hp <= 0 || !seenIdx(v)) continue;
      for (const c of E.neighborsOf(st.map, v.col, v.row)) THREAT_CELLS.add(idx(c.col, c.row));
    }
  }
  function bfsPath(E, map, from, to) {
    if (from === to) return [from];
    const terr = new Map(map.cells.map((c) => [idx(c.col, c.row), c.terrain]));
    const pass = (i) => Number.isFinite(E.modifiersFor(E.DEFAULT_TERRAIN_CONFIG, terr.get(i)).move);
    if (!pass(to)) return null;
    const prev = new Map([[from, -1]]);
    const q = [from];
    while (q.length > 0) {
      const cur = q.shift();
      for (const nb of E.neighborsOf(map, cur % W, Math.floor(cur / W))) {
        const ni = idx(nb.col, nb.row);
        if (prev.has(ni) || !pass(ni)) continue;
        prev.set(ni, cur);
        if (ni === to) {
          const path = [to];
          let p = cur;
          while (p !== -1) { path.unshift(p); p = prev.get(p); }
          return path;
        }
        q.push(ni);
      }
    }
    return null;
  }
  function drawTactical(r, vis, t) {
    if (CMD) {
      const cu = cmdSelUnit();
      if (cu) {
        const st = kf(r);
        const foes = new Set(((st.units && st.units.units) || []).filter((u) => u.owner !== cu.owner && u.hp > 0).map((u) => idx(u.col, u.row)));
        for (const nb of CMD.E.neighborsOf(st.map, cu.col, cu.row)) {
          const i = idx(nb.col, nb.row);
          const [nx, ny] = center(nb.col, nb.row);
          if (foes.has(i)) {
            ctx.save(); ctx.strokeStyle = '#ff5a4e'; ctx.lineWidth = 3;
            ctx.globalAlpha = 0.65 + 0.35 * Math.sin(t * 6);
            hexPath(nx, ny, view.s + 1); ctx.stroke(); ctx.restore();
          } else {
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath(); ctx.arc(nx, ny, 3, 0, 7); ctx.fill();
          }
        }
        if (hov >= 0 && hov !== idx(cu.col, cu.row)) {
          const path = bfsPath(CMD.E, st.map, idx(cu.col, cu.row), hov);
          if (path) {
            ctx.fillStyle = 'rgba(232,193,90,0.9)';
            for (const pi of path.slice(1)) {
              const [px, py] = center(pi % W, Math.floor(pi / W));
              ctx.beginPath(); ctx.arc(px, py, 4, 0, 7); ctx.fill();
            }
          }
        }
      }
    }
    if (heat) {
      const st = kf(r);
      const known = new Set(S.exploredBySnap[r] || []);
      for (const c of st.map.cells) {
        const i = idx(c.col, c.row);
        const [hx, hy] = center(c.col, c.row);
        if (c.resource && known.has(i)) {
          const yld = ((S.configs.economy[c.resource.type] || {}).gatherYield) || 0;
          ctx.fillStyle = `rgba(232,180,60,${(0.12 + 0.3 * yld / HEATMAX).toFixed(2)})`;
          hexPath(hx, hy, view.s); ctx.fill();
        }
        if (THREAT_CELLS.has(i) && (!fog || vis.has(i))) {
          ctx.fillStyle = 'rgba(214,69,69,0.22)';
          hexPath(hx, hy, view.s); ctx.fill();
        }
      }
    }
  }
  function moveTooltip(ev) {
    const tip = $('tooltip');
    if (hov < 0) { tip.hidden = true; return; }
    const cc = hov % W, rr = Math.floor(hov / W);
    const st = kf(rev());
    const cell = st.map.cells[hov];
    if (!cell) { tip.hidden = true; return; }
    let mh = `<b>(${cc},${rr}) ${cell.terrain}</b>`;
    const E = EE();
    if (E) {
      const mv = E.modifiersFor(E.DEFAULT_TERRAIN_CONFIG, cell.terrain).move;
      mh += Number.isFinite(mv) ? ' · <span style="color:#8fd694">passable</span>' : ' · <span style="color:#ff8a7a">blocked</span>';
    }
    // Defense hidden until M024 gives it effect (showing it now would mislead).
    if (cell.resource) {
      const y = ((S.configs.economy[cell.resource.type] || {}).gatherYield) || 0;
      mh += `<br>${RES[cell.resource.type]} node · +${y}/gather · left ${cell.resource.amount}`;
    }
    for (const u of ((st.units && st.units.units) || []).filter((u) => u.col === cc && u.row === rr))
      mh += `<br>${u.owner === 'p1' ? '🔷' : '🔶'} ${u.id} ${u.type} ${u.hp}hp${u.hp <= 0 ? ' DOWN' : ''}`;
    tip.innerHTML = mh;
    tip.hidden = false;
    tip.style.left = (ev.clientX + 16) + 'px';
    tip.style.top = (ev.clientY + 14) + 'px';
  }
  function drawMini(r, vis) {
    const mw = mini.width / W, mh = mini.height / H;
    const known = new Set(S.exploredBySnap[r] || []);
    const TCOL = { field: '#5d8a41', forest: '#2f5c2a', mountain: '#6f7a68', river: '#2e6f9e',
      bridge: '#2e6f9e', road: '#a88954', city: '#e8c15a', village: '#6da054', resource: '#b89a4a' };
    for (const c of kf(r).map.cells) {
      const i = idx(c.col, c.row);
      mctx.fillStyle = !fog || vis.has(i) ? (TCOL[c.terrain] || '#555') : known.has(i) ? '#2a2d36' : '#101218';
      mctx.fillRect(c.col * mw, c.row * mh, mw - 0.5, mh - 0.5);
    }
    for (const u of (kf(r).units ? kf(r).units.units : [])) {
      const i = idx(u.col, u.row);
      if (fog && !vis.has(i)) continue;
      mctx.fillStyle = u.owner === 'p1' ? '#6fa8ff' : '#ff8a7a';
      mctx.beginPath();
      mctx.arc(u.col * mw + mw / 2, u.row * mh + mh / 2, Math.max(2, mw * 0.22), 0, 7);
      mctx.fill();
      if (CMD && u.id === selUnit) {
        mctx.strokeStyle = '#ffffff'; mctx.lineWidth = 1.5;
        mctx.beginPath();
        mctx.arc(u.col * mw + mw / 2, u.row * mh + mh / 2, Math.max(3.5, mw * 0.32), 0, 7);
        mctx.stroke();
      }
    }
    mctx.strokeStyle = '#e8c15a'; mctx.lineWidth = 1.5;
    mctx.strokeRect((sel % W) * mw + 1, Math.floor(sel / W) * mh + 1, mw - 2, mh - 2);
  }
  mini.addEventListener('click', (ev) => {
    const rect = mini.getBoundingClientRect();
    const cc = clamp(Math.floor((ev.clientX - rect.left) / rect.width * W), 0, W - 1);
    const rr = clamp(Math.floor((ev.clientY - rect.top) / rect.height * H), 0, H - 1);
    sel = idx(cc, rr);
    renderPanels();
  });
  $('tCmd').addEventListener('click', () => {
    if (!engineOK()) { toast('Engine bundle missing — run: npm run engine', true); return; }
    if (CMD) exitCommand(); else enterCommand();
  });
  const cmdSide = () => { const u = cmdSelUnit(); return u ? u.owner : 'p1'; };
  $('cmdGather').addEventListener('click', () => {
    const u = cmdSelUnit();
    if (!u) { toast('Select a unit first, sire', true); return; }
    cmdDispatch(u.owner, 'economy.gather', { col: u.col, row: u.row });
  });
  function disarmAttack(silent) {
    if (!attackArmed) return;
    attackArmed = false;
    $('cmdAttack').classList.remove('armed');
    canvas.style.cursor = 'default';
    if (!silent) toast('Attack stood down.', false);
  }
  $('cmdAttack').addEventListener('click', () => {
    if (!CMD) return;
    const u = cmdSelUnit();
    if (!u) { toast('Select a unit first, sire', true); return; }
    if (attackArmed) { disarmAttack(); return; }
    attackArmed = true;
    $('cmdAttack').classList.add('armed');
    canvas.style.cursor = 'crosshair';
    toast(`⚔ ${u.id} ready — click an adjacent enemy (button / right-click / ESC to stand down)`, false);
  });
  for (const [bid, btype] of [['cmdHouse', 'house'], ['cmdTower', 'tower'], ['cmdStorage', 'storage']])
    $(bid).addEventListener('click', () => cmdDispatch(cmdSide(), 'city.build', { type: btype }));
  $('cmdWait').addEventListener('click', () => cmdDispatch(cmdSide(), 'world.noop', {}));
  $('cmdUpgrade').addEventListener('click', () => cmdDispatch(cmdSide(), 'city.upgrade', {}));
  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    for (const t of ['cell', 'build', 'city', 'log']) $('tab-' + t).hidden = t !== b.dataset.tab;
    const log = document.querySelector('#tab-log .log');
    if (b.dataset.tab === 'log' && log) log.scrollTop = log.scrollHeight;
  }));
  $('vFog').addEventListener('click', () => { fog = true; $('vFog').classList.add('on'); $('vFull').classList.remove('on'); renderPanels(); });
  $('vFull').addEventListener('click', () => { fog = false; $('vFull').classList.add('on'); $('vFog').classList.remove('on'); renderPanels(); });
  $('vHeat').addEventListener('click', () => {
    heat = !heat;
    $('vHeat').classList.toggle('on', heat);
    sfx('click');
  });
  $('fine').textContent = 'Provenance: ' + S.meta.generatedBy + ' · ruleset standard v1 · ' +
    S.events.length + ' events · ' + N + ' keyframes (motion interpolates; all stops are genuine snapshots) · ' +
    'fog/memory recomputed by the real engine per keyframe · terrain, resources, units, counts genuine; soldier sprites, building tiles & herald lines are illustrative. Kenney art (CC0, kenney.nl); windmill & wildlife are decorative ambience.';

  layout();
  renderPanels();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
