<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Warlords — Live Chronicle (MOCKUP · Age of Empires style)</title>
<style>
  :root {
    --gold:#e8c15a; --gold-dim:#8a6d2f; --ink:#f0e8d4; --dim:#b8ab8a;
    --stone1:#33383f; --stone2:#22262c; --stone3:#171b20;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; color:var(--ink); font:14px/1.45 system-ui,sans-serif;
    background:#0b0d10 radial-gradient(1200px 600px at 50% 0%, #1a2027, #0b0d10);
    display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  .display { font-family:Georgia,'Palatino Linotype','Times New Roman',serif; letter-spacing:2px; }
  .ribbon { background:repeating-linear-gradient(45deg,#3a2f10,#3a2f10 12px,#241f0a 12px,#241f0a 24px);
    color:var(--gold); text-align:center; padding:3px; font-size:11px; letter-spacing:2px; flex:none; }
  .topbar { display:flex; align-items:center; justify-content:center; gap:14px; padding:6px 12px;
    background:linear-gradient(#3a4048,#23272e); border-bottom:3px double var(--gold-dim); flex-wrap:wrap; flex:none; }
  .realm { font-size:18px; color:var(--gold); }
  .resbar { display:flex; gap:0; background:#101318; border:2px solid var(--gold-dim); border-radius:8px; overflow:hidden; }
  .resbar span { padding:5px 12px; border-left:1px solid #3a3f47; white-space:nowrap; }
  .resbar span:first-child { border-left:none; }
  .resbar b { color:var(--gold); }
  .age { background:#3d2f12; border:2px solid var(--gold-dim); border-radius:8px; padding:5px 12px; color:var(--gold); }
  .sbtn { background:linear-gradient(#4a5058,#2c3138); color:var(--ink); border:2px solid var(--gold-dim);
    border-radius:8px; padding:4px 12px; cursor:pointer; font-family:inherit; }
  .sbtn:hover { border-color:var(--gold); color:var(--gold); }
  .sbtn.on { background:var(--gold); color:#171204; font-weight:700; }
  .links a { color:var(--dim); font-size:12px; margin-left:8px; }
  /* ── Live transport ── */
  .transport { display:flex; align-items:center; gap:8px; padding:6px 14px;
    background:#141920; border-bottom:2px solid var(--gold-dim); flex-wrap:wrap; flex:none; }
  .live { display:inline-flex; align-items:center; gap:6px; font-weight:800; color:#ff6b6b; letter-spacing:2px; }
  .live i { width:10px; height:10px; border-radius:50%; background:#ff3b3b; animation:blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .tbtn { background:linear-gradient(#4a5058,#2c3138); color:var(--ink); border:2px solid var(--gold-dim);
    border-radius:8px; padding:3px 12px; cursor:pointer; font-size:15px; font-family:inherit; }
  .tbtn:hover { border-color:var(--gold); }
  #speed { background:#101318; color:var(--gold); border:2px solid var(--gold-dim); border-radius:8px; padding:3px 6px; font-family:inherit; }
  .progress { flex:1; min-width:200px; height:14px; background:#0a0d13; border:1px solid var(--gold-dim);
    border-radius:7px; position:relative; cursor:pointer; }
  .progress .fill { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,#7a5f1e,var(--gold));
    border-radius:6px; width:0; }
  .progress .stop { position:absolute; top:-3px; width:3px; height:18px; background:#4a5058; }
  .progress .stop.done { background:var(--gold); }
  #nowplay { color:var(--dim); font-size:12px; min-width:180px; }
  /* ── Isometric arena ── */
  .arena { flex:1; min-height:300px; position:relative; margin:8px 10px 0;
    border:3px double var(--gold-dim); border-radius:6px; overflow:hidden; background:#05070a; }
  #iso { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:pointer; }
  #floatlayer { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .floater { position:absolute; transform:translate(-50%,-100%); font:bold 15px Georgia,serif;
    color:var(--gold); text-shadow:0 2px 3px #000, 0 0 8px #000; white-space:nowrap;
    animation:rise 1.5s ease-out forwards; }
  .floater.big { font-size:19px; color:#ffe9a8; }
  @keyframes rise { 0% { opacity:0; margin-top:10px; } 15% { opacity:1; } 100% { opacity:0; margin-top:-46px; } }
  #herald { position:absolute; left:10px; bottom:8px; max-width:60%; background:rgba(10,12,16,.82);
    border:1px solid var(--gold-dim); border-radius:8px; padding:4px 12px; font:italic 13px Georgia,serif;
    color:var(--gold); pointer-events:none; }
  #statusline { font-size:12px; color:var(--dim); padding:5px 14px 0; flex:none; }
  #statusline b { color:var(--ink); }
  /* ── Dock ── */
  .dock { display:grid; grid-template-columns:190px minmax(0,1fr) 320px; gap:8px; padding:6px 10px 8px; flex:none; }
  .stone { background:linear-gradient(#2e333b,#1d2126); border:3px double var(--gold-dim);
    border-radius:8px; padding:8px; min-height:0; }
  .stone h4 { margin:0 0 6px; color:var(--gold); font-size:12px; letter-spacing:2px; }
  #mini { width:100%; display:block; border:2px solid #101318; border-radius:4px; }
  .tabs { display:flex; gap:6px; margin-bottom:6px; }
  .tabs button { flex:1; background:#101318; color:var(--dim); border:2px solid #3a3f47;
    border-radius:6px; padding:5px; cursor:pointer; font-family:Georgia,serif; letter-spacing:1px; }
  .tabs button.on { color:var(--gold); border-color:var(--gold-dim); }
  .card { background:#101318; border:1px solid #3a3f47; border-radius:6px; padding:6px 8px; margin-bottom:6px; }
  .card h5 { margin:0 0 4px; color:var(--gold); font-size:11px; letter-spacing:2px; }
  .brow { display:flex; justify-content:space-between; align-items:center; padding:3px 0; border-top:1px dotted #3a3f47; font-size:13px; }
  .brow:first-of-type { border-top:none; }
  .brow.now { background:#2a2410; margin:0 -8px; padding:3px 8px; }
  .cost { color:var(--dim); font-size:12px; }
  .afford { color:#7fd08f; } .poor { color:#e07f7f; }
  .qbar { height:8px; background:#2c3138; border-radius:4px; overflow:hidden; margin-top:3px; }
  .qbar i { display:block; height:100%; background:var(--gold); transition:width .8s ease; }
  .log { max-height:150px; overflow:auto; font-size:12px; }
  .log div { padding:2px 0; border-top:1px dotted #3a3f47; }
  .log .t { color:var(--dim); }
  .log div.fresh { animation:flash 1.6s ease; }
  @keyframes flash { 0% { background:#4a3f14; } 100% { background:transparent; } }
  .orders { max-height:168px; overflow:auto; }
  .order { display:flex; gap:8px; align-items:center; width:100%; text-align:left; background:#101318;
    color:var(--dim); border:1px solid #3a3f47; border-radius:6px; padding:4px 8px; margin-bottom:4px;
    cursor:pointer; font:12px system-ui,sans-serif; }
  .order:hover { border-color:var(--gold); color:var(--ink); }
  .order.done { color:var(--ink); }
  .order.done .n { background:#2c4a2c; border-color:#57a773; color:#cfd; }
  .order.now { border-color:var(--gold); background:#2a2410; color:var(--gold); }
  .order .n { background:#2c3138; border:1px solid #3a3f47; border-radius:4px; padding:0 6px; font-weight:700; }
  .fine { color:var(--dim); font-size:11px; padding:0 12px 8px; flex:none; }
  a { color:var(--gold); }
</style>

    ctx.strokeStyle = '#7d5a26'; ctx.lineWidth = Math.max(1, s * 0.02);
    for (let i = 1; i <= 3; i++) {

    ctx.lineTo(x + tw * 0.42, gy - th); ctx.lineTo(x + tw * 0.62, gy); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8d8776'; ctx.fillRect(x - tw * 0.55, gy - th - s * 0.12, tw * 1.1, s * 0.12);

    ctx.beginPath(); ctx.moveTo(x, gy - th - s * 0.5); ctx.lineTo(x + s * 0.3, gy - th - s * 0.44 + wave);
    ctx.lineTo(x, gy - th - s * 0.34); ctx.closePath(); ctx.fill();
  }
  function drawStorage(x, y, s) {
    const gy = y + s * 0.22, w = s * 0.7, hh = s * 0.34;
    ctx.fillStyle = '#8a6238'; ctx.fillRect(x - w / 2, gy - hh, w, hh);
    ctx.fillStyle = '#6b4a26';
    for (let i = 0; i < 4; i++) ctx.fillRect(x - w / 2 + i * w / 4, gy - hh, 2, hh);
    ctx.fillStyle = '#5d4020';
    ctx.beginPath(); ctx.moveTo(x - w * 0.62, gy - hh); ctx.lineTo(x, gy - hh - s * 0.3);
    ctx.lineTo(x + w * 0.62, gy - hh); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a97e3f'; ctx.fillRect(x - w * 0.62, gy - s * 0.16, s * 0.16, s * 0.16);

  function pill(x, y, text, fg, bg) {

  }

  // Soldier sprite: tiny blue/red warrior with helmet, weapon, idle bob.
  function soldier(x, y, s, side, type, phase, t) {
    const h = s * 0.52, bob = Math.sin(t * 2.6 + phase) * s * 0.02;
    y += bob;
    const col = side === 'p1' ? '#2b5fc7' : '#c7322b';
    const dark = side === 'p1' ? '#1a3f8f' : '#8f1f1d';
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(x, y, h * 0.28, h * 0.12, 0, 0, 7); ctx.fill();
    const f = facing[side + type + phase] || 1;
    ctx.strokeStyle = '#3a2c18'; ctx.lineWidth = Math.max(1, h * 0.09);
    ctx.beginPath(); ctx.moveTo(x, y - h * 0.42); ctx.lineTo(x - h * 0.1, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y - h * 0.42); ctx.lineTo(x + h * 0.1, y); ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.roundRect(x - h * 0.2, y - h * 0.78, h * 0.4, h * 0.42, h * 0.1); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = Math.max(1, h * 0.05);
    ctx.beginPath(); ctx.roundRect(x - h * 0.2, y - h * 0.78, h * 0.4, h * 0.42, h * 0.1); ctx.stroke();
    ctx.fillStyle = '#e8b98a';
    ctx.beginPath(); ctx.arc(x, y - h * 0.88, h * 0.15, 0, 7); ctx.fill();
    if (type === 'warrior') {
      ctx.fillStyle = '#9aa2ad';
      ctx.beginPath(); ctx.arc(x, y - h * 0.92, h * 0.16, Math.PI, 0); ctx.fill();
      ctx.fillRect(x - h * 0.02, y - h * 1.02, h * 0.04, h * 0.16);
      ctx.strokeStyle = '#6b4a26'; ctx.lineWidth = Math.max(1, h * 0.05);
      ctx.beginPath(); ctx.moveTo(x + f * h * 0.3, y - h * 1.15); ctx.lineTo(x + f * h * 0.22, y - h * 0.1); ctx.stroke();
      ctx.fillStyle = '#cfd6dd';
      ctx.beginPath(); ctx.moveTo(x + f * h * 0.3, y - h * 1.3); ctx.lineTo(x + f * h * 0.24, y - h * 1.12);
      ctx.lineTo(x + f * h * 0.36, y - h * 1.12); ctx.closePath(); ctx.fill();
    } else if (type === 'archer') {
      ctx.fillStyle = '#3f6b3a';
      ctx.beginPath(); ctx.moveTo(x - h * 0.17, y - h * 0.86); ctx.lineTo(x, y - h * 1.08); ctx.lineTo(x + h * 0.17, y - h * 0.86); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#7a5230'; ctx.lineWidth = Math.max(1, h * 0.05);
      ctx.beginPath(); ctx.arc(x + f * h * 0.28, y - h * 0.55, h * 0.2, -1.2, 1.2); ctx.stroke();
    } else {
      ctx.fillStyle = '#6b4a26';
      ctx.beginPath(); ctx.arc(x, y - h * 0.94, h * 0.15, Math.PI, 0); ctx.fill();
      ctx.fillRect(x - h * 0.2, y - h * 0.95, h * 0.4, h * 0.05);
      ctx.strokeStyle = '#4a3520'; ctx.lineWidth = Math.max(1, h * 0.05);
      ctx.beginPath(); ctx.moveTo(x + f * h * 0.25, y - h * 0.9); ctx.lineTo(x + f * h * 0.18, y - h * 0.3); ctx.stroke();

  }
  const FORM = [[-0.3, 0.05], [0.02, -0.16], [0.32, 0.05], [-0.15, 0.28], [0.17, 0.28], [0.02, 0.1]];

  // Genuine per-unit max HP = peak HP observed across all keyframes.
  const maxHpById = {};
  for (const sn of S.snapshots) for (const u of (sn.units ? sn.units.units : []))
    maxHpById[u.id] = Math.max(maxHpById[u.id] || 0, u.hp);

  function drawTile(cell, r, vis, t) {
    const s = view.s, [x, y] = center(cell.col, cell.row);
    const i = idx(cell.col, cell.row);
    const seen = !fog || vis.has(i);
    const known = (S.exploredBySnap[r] || []).includes(i);
    if (fog && !seen && !known) { block(x, y, s, '#11141d'); return; }
    const dim = fog && !seen;
    ctx.save();
    if (dim && 'filter' in ctx) ctx.filter = 'brightness(0.55) saturate(0.7)';
    const rnd = mulberry((cell.col * 31 + cell.row * 57) * 2654435761);
    const gvar = 0.92 + hash2(cell.col, cell.row) * 0.16;
    const terr = cell.terrain;
    let top = '#5d8a41';
    if (terr === 'field') top = shade('#5d8a41', gvar);
    else if (terr === 'forest') top = shade('#3f7038', gvar);
    else if (terr === 'mountain') top = shade('#6f7a68', gvar);
    else if (terr === 'river' || terr === 'bridge') top = '#2e6f9e';
    else if (terr === 'road') top = shade('#a88954', gvar);
    else if (terr === 'city') top = '#8f8a76';
    else if (terr === 'village') top = shade('#6da054', gvar);
    else if (terr === 'resource') {
      const rt = cell.resource ? cell.resource.type : 'gold';
      top = rt === 'gold' ? '#8a6f3c' : rt === 'wood' ? shade('#4f7d3a', gvar) : rt === 'stone' ? '#7d838e' : '#b89a4a';
    }
    block(x, y, s, top);
    const gy = y + s * 0.28;
    if (terr === 'field') {
      for (let q = 0; q < 4; q++) tuft(x + (rnd() - 0.5) * s, gy - rnd() * s * 0.3, s, rnd() > 0.75 ? '#d8cf8a' : '#3f7038');
      if (rnd() > 0.6) { ctx.fillStyle = '#c96a6a'; ctx.beginPath(); ctx.arc(x + (rnd() - 0.5) * s * 0.8, gy - s * 0.12, s * 0.035, 0, 7); ctx.fill(); }
    } else if (terr === 'forest') {
      const n = 4 + Math.floor(rnd() * 3);
      for (let q = 0; q < n; q++) {
        const px = x + (rnd() - 0.5) * s * 1.15, py = gy - rnd() * s * 0.45;
        pine(px, py, s * (0.75 + rnd() * 0.45), rnd() > 0.5);
      }
    } else if (terr === 'mountain') {
      drawMountain(x, gy, s, rnd);

    } else if (terr === 'river' || terr === 'bridge') {
      ctx.strokeStyle = 'rgba(180,220,240,0.5)'; ctx.lineWidth = Math.max(1, s * 0.025);

        ctx.beginPath(); ctx.moveTo(x - s * 0.5 + off, yy);
        ctx.quadraticCurveTo(x + off, yy - s * 0.08, x + s * 0.5 + off, yy); ctx.stroke();
      }
      if (terr === 'bridge') {
        ctx.fillStyle = '#7a5c3a';
        ctx.save(); ctx.translate(x, y); ctx.rotate(-0.12);
        ctx.fillRect(-s * 0.75, -s * 0.2, s * 1.5, s * 0.4);
        ctx.strokeStyle = '#4a3520'; ctx.lineWidth = Math.max(1, s * 0.02);
        for (let q = 0; q <= 6; q++) { ctx.beginPath(); ctx.moveTo(-s * 0.75 + q * s * 0.25, -s * 0.2); ctx.lineTo(-s * 0.75 + q * s * 0.25, s * 0.2); ctx.stroke(); }
        ctx.restore();
      }
    } else if (terr === 'road') {
      ctx.strokeStyle = 'rgba(90,64,32,0.55)'; ctx.lineWidth = Math.max(1.5, s * 0.035);

        ctx.quadraticCurveTo(x, y + off * s - s * 0.12, x + s * 0.5, y + off * s + s * 0.05); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(60,44,22,0.5)';
      for (let q = 0; q < 5; q++) { ctx.beginPath(); ctx.arc(x + (rnd() - 0.5) * s, y + (rnd() - 0.5) * s * 0.5, s * 0.025, 0, 7); ctx.fill(); }
    } else if (terr === 'city') {

    } else if (terr === 'village') {
      drawHut(x - s * 0.3, y, s, s * 0.5, s * 0.3, s * 0.3, true, t, 0.2);
      drawHut(x + s * 0.32, y + s * 0.08, s, s * 0.42, s * 0.26, s * 0.26, false, t, 0.7);
    } else if (terr === 'resource' && cell.resource) {
      const rt = cell.resource.type;

        ctx.beginPath(); ctx.ellipse(x, gy, s * 0.45, s * 0.2, 0, 0, 7); ctx.fill();
        for (let q = 0; q < 4; q++) {
          const px = x + (rnd() - 0.5) * s * 0.6, py = gy - rnd() * s * 0.18;
          ctx.fillStyle = '#f2c230'; ctx.strokeStyle = '#9a7414'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(px - s * 0.07, py); ctx.lineTo(px, py - s * 0.09);
          ctx.lineTo(px + s * 0.07, py); ctx.lineTo(px, py + s * 0.05); ctx.closePath(); ctx.fill(); ctx.stroke();
        }
        ctx.fillStyle = '#fff';
        ctx.fillRect(x - s * 0.02, gy - s * 0.2, s * 0.04, s * 0.04);
      } else if (rt === 'wood') {
        for (let q = 0; q < 3; q++) {
          const px = x - s * 0.25 + q * s * 0.22, py = gy - (q === 1 ? s * 0.14 : 0);
          ctx.fillStyle = '#7a5230'; ctx.fillRect(px - s * 0.14, py - s * 0.09, s * 0.28, s * 0.11);
          ctx.fillStyle = '#c9a06a'; ctx.beginPath(); ctx.ellipse(px + s * 0.14, py - s * 0.035, s * 0.035, s * 0.055, 0, 0, 7); ctx.fill();
        }
        ctx.fillStyle = '#8a6238'; ctx.fillRect(x + s * 0.32, gy - s * 0.16, s * 0.14, s * 0.16);
        ctx.fillStyle = '#c9a06a'; ctx.beginPath(); ctx.ellipse(x + s * 0.39, gy - s * 0.16, s * 0.07, s * 0.03, 0, 0, 7); ctx.fill();

        ctx.strokeStyle = 'rgba(122,90,32,0.7)'; ctx.lineWidth = Math.max(1.5, s * 0.04);
        for (let q = -2; q <= 2; q++) {
          ctx.beginPath(); ctx.moveTo(x + q * s * 0.28, y - s * 0.5);
          ctx.quadraticCurveTo(x + q * s * 0.28 + s * 0.08, y, x + q * s * 0.28, y + s * 0.5); ctx.stroke();
        }
        ctx.fillStyle = '#e8d06a';
        for (let q = 0; q < 10; q++) { ctx.beginPath(); ctx.arc(x + (rnd() - 0.5) * s * 1.3, y + (rnd() - 0.5) * s * 0.8, s * 0.03, 0, 7); ctx.fill(); }
        ctx.restore();
      }
      pill(x, gy + s * 0.32, `${RES[rt]} ${cell.resource.amount}`, '#ffe9a8', 'rgba(12,10,4,0.78)');
    }
    // Illustrative buildings (counts genuine, tile choice artistic).
    const b = kf(r).buildings.buildings.p1;
    const isSlot = (sx, sy) => cell.col === sx && cell.row === sy;
    const houseIdx = HOUSE_SLOTS.findIndex(([hx, hy]) => isSlot(hx, hy));
    if (houseIdx >= 0 && houseIdx < (b.house || 0))
      drawHut(x, y - s * 0.12, s, s * 0.52, s * 0.32, s * 0.34, true, t, cell.col * 0.3 + cell.row * 0.17);
    if (isSlot(TOWER_SLOT[0], TOWER_SLOT[1]) && (b.tower || 0) > 0) drawTowerB(x, y - s * 0.1, s, t);
    if (isSlot(STORAGE_SLOT[0], STORAGE_SLOT[1]) && (b.storage || 0) > 0) drawStorage(x, y - s * 0.05, s);
    ctx.restore();
    if (dim) { ctx.fillStyle = 'rgba(8,10,22,0.45)'; hexPath(x, y, s); ctx.fill(); }
  }

  function drawUnits(tracks, r, vis, t) {
    const s = view.s;
    for (const tr of tracks) {
      const u = tr.u;
      const ci = idx(clamp(Math.round(tr.col), 0, W - 1), clamp(Math.round(tr.row), 0, H - 1));
      if (fog && u.owner !== 'p1' && !vis.has(ci)) continue;
      const [x, y0] = center(tr.col, tr.row);
      const y = y0 + s * 0.3;
      const n = clamp(u.hp, 1, 6);
      for (let q = 0; q < n; q++) {
        const [ox, oy] = FORM[q % FORM.length];
        soldier(x + ox * s, y + oy * s * 0.6, s, u.owner, u.type, q * 1.7 + tr.col, t + tr.row);
      }
      // HP bar + nameplate
      const fracHp = clamp(u.hp / (maxHpById[u.id] || u.hp), 0, 1);
      const bw = s * 0.95, bx = x - bw / 2, by = y - s * 0.78;
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(bx - 1, by - 1, bw + 2, s * 0.11 + 2);
      ctx.fillStyle = fracHp > 0.6 ? '#57a773' : fracHp > 0.3 ? '#e8c15a' : '#d64545';
      ctx.fillRect(bx, by, bw * fracHp, s * 0.11);
      pill(x, by - s * 0.2, `${u.id} ${u.hp}`, u.owner === 'p1' ? '#bcd2ff' : '#ffb4b4', 'rgba(8,8,12,0.78)');
    }
  }

  if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); return this; };
  }

  function visNow() {
    const k = Math.min(Math.floor(pos), N - 1), kk = Math.min(k + 1, N - 1), f = frac();
    const va = new Set(S.visibilityBySnap[k] || []), vb = new Set(S.visibilityBySnap[kk] || []);
    return { vis: (f > 0 && f < 1) ? new Set([...va, ...vb]) : (pos >= N - 1 || rev() > k ? vb : va), r: rev(), k, f, e: ease(f) };
  }

  function drawClouds(t, cw, ch) {
    ctx.save();
    ctx.fillStyle = 'rgba(220,228,240,0.07)';
    for (let q = 0; q < 3; q++) {
      const span = cw + 400;
      const cx = ((t * (9 + q * 5) + q * span / 3) % span) - 200;
      const cy = ch * (0.14 + q * 0.2);
      ctx.beginPath(); ctx.ellipse(cx, cy, 150 + q * 40, 34 + q * 8, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + 90, cy + 12, 100, 26, 0, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  function floater(c, r, text, big) {
    const layer = $('floatlayer');
    while (layer.children.length >= 12) layer.removeChild(layer.firstChild);
    const [x, y] = center(c, r);
    const d = document.createElement('div');
    d.className = 'floater' + (big ? ' big' : '');
    d.style.left = x + 'px'; d.style.top = (y - view.s * 0.9) + 'px';
    d.textContent = text;
    layer.appendChild(d);
    setTimeout(() => d.remove(), 1600);
  }

  function frame(now) {
    const dt = Math.min(100, now - last);
    last = now;
    const t = now / 1000;
    if (playing && pos < N - 1) {
      pos = Math.min(N - 1, pos + dt / (BASE_DUR / speed));
      const r = rev();
      if (r > firedRev) fireTransition(r - 1, r);
      if (pos >= N - 1) { playing = false; $('tPlay').textContent = '⟳'; }
    }
    shake = Math.max(0, shake - dt / 500);
    const { vis, r, k, e } = visNow();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const cw = canvas.width / dpr, ch = canvas.height / dpr;
    const bg = ctx.createRadialGradient(cw / 2, ch * 0.42, 40, cw / 2, ch * 0.5, Math.max(cw, ch) * 0.75);
    bg.addColorStop(0, '#232028'); bg.addColorStop(0.55, '#141318'); bg.addColorStop(1, '#05060a');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, cw, ch);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 7 * shake, (Math.random() - 0.5) * 7 * shake);
    const tracks = track(e);
    for (let row = 0; row < H; row++) {
      for (const cell of kf(r).map.cells) {
        if (cell.row !== row) continue;
        drawTile(cell, r, vis, t);
      }
      for (const tr of tracks) {
        if (Math.round(tr.row) === row) drawUnits([tr], r, vis, t);
      }
    }
    for (const [ii, col, lw] of [[sel, '#e8c15a', 3], [hov, 'rgba(255,255,255,0.7)', 1.5]]) {
      if (ii < 0 || (ii === sel && col !== '#e8c15a')) continue;
      const cc = ii % W, rr = Math.floor(ii / W);
      const [x, y] = center(cc, rr);
      ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw;
      ctx.shadowColor = col; ctx.shadowBlur = ii === sel ? 12 : 0;
      hexPath(x, y, view.s + 1); ctx.stroke(); ctx.restore();
    }
    drawClouds(t, cw, ch);
    ctx.restore();
    // HUD (tweened piles)
    const kk = Math.min(k + 1, N - 1);
    const pa = (kf(k).stockpiles && kf(k).stockpiles.stockpiles.p1) || {};
    const pb = (kf(kk).stockpiles && kf(kk).stockpiles.stockpiles.p1) || {};
    $('res').innerHTML = ['food', 'wood', 'stone', 'gold'].map((res) =>
      `<span>${RES[res]} <b>${Math.round(lerp(pa[res] || 0, pb[res] || 0, e))}</b></span>`).join('') +
      `<span title="real unit count; cap ungrounded">⚔ <b>${(kf(r).units ? kf(r).units.units : []).filter((u) => u.owner === 'p1').length}</b>/200*</span>`;
    $('tick').textContent = 'TICK ' + kf(r).tick;
    $('pop').textContent = `Population ${(kf(r).units ? kf(r).units.units : []).filter((u) => u.owner === 'p1').length} (cap 200: concept)`;
    $('fill').style.width = (100 * pos / (N - 1)).toFixed(1) + '%';
    document.querySelectorAll('#prog .stop').forEach((d, i) => d.classList.toggle('done', i < r));
    const c0 = kf(r).map.cells[sel], chov = hov >= 0 ? kf(r).map.cells[hov] : null;
    $('statusline').innerHTML = `Tick <b>${kf(r).tick}</b> · Order <b>${r}/15</b> · ` +
      `👁 <b>${vis.size}</b> seen · 🗺 <b>${(S.exploredBySnap[r] || []).length}</b> remembered · ` +
      `Selected <b>(${c0.col},${c0.row}) ${c0.terrain}</b>` +
      (chov && hov !== sel ? ` · hover <b>(${chov.col},${chov.row}) ${chov.terrain}</b>` : '') +
      (fog ? '' : ' · <b>strategist view (full state)</b>');
    requestAnimationFrame(frame);
  }

  function fireTransition(from, to) {
    firedRev = to;
    const A = kf(from), B = kf(to);
    const am = {}, cellsA = {};
    for (const c of A.map.cells) if (c.resource) { am[idx(c.col, c.row)] = c.resource.amount; cellsA[idx(c.col, c.row)] = c; }
    for (const c of B.map.cells) {
      if (!c.resource) continue;
      const i = idx(c.col, c.row);
      if ((am[i] ?? c.resource.amount) > c.resource.amount)
        floater(c.col, c.row, `+${am[i] - c.resource.amount} ${RES[c.resource.type]}`, false);
    }
    for (const e of S.events) {
      if (e.revision !== to) continue;
      if (e.type === 'build.completed') {
        const city = B.map.cells.find((c) => c.terrain === 'city');
        floater(city.col, city.row, `${BICON[e.payload.building] || '🏗'} ${e.payload.building} raised!`, true);
        shake = 1;
      }
      if (e.type === 'build.started') {
        const city = B.map.cells.find((c) => c.terrain === 'city');
        floater(city.col, city.row, `🏗 ${e.payload.building} begun…`, false);
      }
    }
    const la = A.cities && A.cities.cities.p1 && A.cities.cities.p1.level;
    const lb = B.cities && B.cities.cities.p1 && B.cities.cities.p1.level;
    if (la !== undefined && lb !== undefined && lb > la) {
      const city = B.map.cells.find((c) => c.terrain === 'city');
      floater(city.col, city.row, `⬢ CITY LEVEL ${lb}!`, true);
      shake = 1;
    }
    $('herald').textContent = `📯 Herald (CONCEPT): ${HERALDS[SCRIPT[to]] || '…'}`;
    const sfxFor = { 'economy.gather': 'coin', 'unit.move': 'step', 'city.build': 'hammer', 'match.advance': 'whoosh', 'city.upgrade': 'fanfare' };
    if (sfxFor[SCRIPT[to]]) sfx(sfxFor[SCRIPT[to]]);
    $('nowplay').textContent = `#${to} ${(S.outcomes[to - 1] && S.outcomes[to - 1].summary) || ''}`;
    renderPanels();
    const log = document.querySelector('#tab-log .log');
    if (log && !$('tab-log').hidden) log.scrollTop = log.scrollHeight;
  }

  function renderPanels() {
    const st = kf(rev()), r = rev();
    const c = st.map.cells[sel];
    const piles = (st.stockpiles && st.stockpiles.stockpiles.p1) || {};
    const vis = new Set(S.visibilityBySnap[r] || []);
    const here = (st.units ? st.units.units : []).filter((u) => idx(u.col, u.row) === sel)
      .filter((u) => !fog || u.owner === 'p1' || vis.has(sel));
    const slotNote = (HOUSE_SLOTS.some(([hx, hy]) => hx === c.col && hy === c.row) ||
      (TOWER_SLOT[0] === c.col && TOWER_SLOT[1] === c.row) ||
      (STORAGE_SLOT[0] === c.col && STORAGE_SLOT[1] === c.row))
      ? '<div style="color:var(--dim);font-size:11px">🏠 Building art here is illustrative; counts are genuine.</div>' : '';
    $('tab-cell').innerHTML = `<div class="card"><h5>Cell ${sel} (${c.col},${c.row}) — ${c.terrain}</h5>` +
      (c.resource ? `<div>Node: ${RES[c.resource.type]} ${c.resource.type} × <b>${c.resource.amount}</b></div>` : '<div>No node here.</div>') +
      (here.length ? here.map((u) => `<div>${UICON[u.type]} <b>${u.id}</b> ${u.type} · ${u.owner} · HP ${u.hp}/${S.configs.unitsScenario[u.type].maxHp} · ⚔${S.configs.unitsScenario[u.type].damage}</div>`).join('') : '<div>No units here.</div>') +
      slotNote + '</div>';
    const bcfg = S.configs.buildings;
    $('tab-build').innerHTML = `<div class="card"><h5>Build (real costs, scripted queue)</h5>` +
      ['town-center', 'house', 'storage', 'barracks', 'wall', 'tower'].map((b) => {
        const ok = Object.entries(bcfg[b].cost || {}).every(([t, v]) => (piles[t] || 0) >= v);
        const have = (st.buildings.buildings.p1[b] || 0);
        return `<div class="brow"><span>${BICON[b]} ${b} ×<b>${have}</b> <span class="cost">${Object.entries(bcfg[b].cost || {}).map(([t, v]) => `${RES[t]}${v}`).join(' ') || 'free'} · ${bcfg[b].buildTime}t</span></span>` +
        `<span class="${ok ? 'afford' : 'poor'}">${ok ? '✓' : '✗'}</span></div>`;
      }).join('') + '</div>';
    const city = st.cities && st.cities.cities.p1;
    $('tab-city').innerHTML = city ? `<div class="card"><h5>Thy city — level ${city.level}</h5>` +
      (city.queue.length ? city.queue.map((q) => {
        const total = bcfg[q.type].buildTime || 1;
        const done = 100 * (1 - q.remaining / total);
        return `<div>${BICON[q.type]} ${q.type} — ${q.remaining}t left<div class="qbar"><i style="width:${done}%"></i></div></div>`;
      }).join('') : '<div>Queue idle.</div>') + `<div style="margin-top:6px"><a href="city.html">open city view →</a></div></div>` : '<div class="card">No city.</div>';
    const evs = S.events.filter((e) => e.revision <= r);
    $('tab-log').innerHTML = `<div class="card log"><h5>Chronicle (real, ≤ order #${r})</h5>` +
      evs.map((e) => `<div class="${e.revision === r && r > 0 ? 'fresh' : ''}"><span class="t">#${e.seq} t${e.tick}</span> <b>${e.type}</b> ${esc(JSON.stringify(e.payload))}</div>`).join('') + '</div>';
    const T = { field:'#5d8a41', forest:'#2f5d33', mountain:'#8a8f98', river:'#3d6e9e', road:'#b0925e',
      bridge:'#7a5c3a', resource:'#6b6234', village:'#c9a86a', city:'#b03a3a' };
    let mh = '';
    for (const cell of st.map.cells) {
      const i = idx(cell.col, cell.row);
      const fill = (!fog || vis.has(i)) ? T[cell.terrain] : ((S.exploredBySnap[r] || []).includes(i) ? '#2a3446' : '#0a0c12');
      mh += `<rect x="${cell.col * 20}" y="${cell.row * 20}" width="19" height="19" fill="${fill}"/>`;
    }
    for (const u of (st.units ? st.units.units : [])) {
      const i = idx(u.col, u.row);
      if (fog && u.owner !== 'p1' && !vis.has(i)) continue;
      mh += `<circle cx="${u.col * 20 + 10}" cy="${u.row * 20 + 10}" r="4" fill="${u.owner === 'p1' ? '#3d7dd6' : '#d64545'}"/>`;
    }
    $('mini').innerHTML = mh;
    document.querySelectorAll('#orders .order').forEach((d) => {
      const k = Number(d.dataset.k);
      d.classList.toggle('now', k === r);
      d.classList.toggle('done', k < r);
    });
  }

  // ── Wiring ──
  const prog = $('prog');
  for (let i = 1; i < N; i++) {
    const d = document.createElement('div');
    d.className = 'stop'; d.style.left = (100 * i / (N - 1)) + '%';
    d.title = `#${i} ${(S.outcomes[i - 1] && S.outcomes[i - 1].summary) || ''}`;
    prog.appendChild(d);
  }
  prog.addEventListener('click', (ev) => {
    const rect = prog.getBoundingClientRect();
    const at = Math.round((ev.clientX - rect.left) / rect.width * (N - 1));
    pos = clamp(at, 0, N - 1);
    firedRev = rev();
    $('nowplay').textContent = pos === 0 ? '' : `#${rev()} ${(S.outcomes[rev() - 1] && S.outcomes[rev() - 1].summary) || ''}`;
    renderPanels();
  });
  const ordersEl = $('orders');
  S.outcomes.forEach((o, k) => {
    const b = document.createElement('button');
    b.className = 'order'; b.dataset.k = String(k + 1);
    b.innerHTML = `<span class="n">${k + 1}</span><span>${esc(o.summary || o.reason || o.status)} <span class="cost">· ${o.status}</span></span>`;
    b.addEventListener('click', () => {
      pos = k + 1; firedRev = rev();
      $('nowplay').textContent = `#${k + 1} ${esc(o.summary || '')}`;
      renderPanels();
    });
    ordersEl.appendChild(b);
  });
  function pick(ev) {
    const rect = canvas.getBoundingClientRect();
    const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    const rr = Math.round((my - view.oy) / (view.s * 1.5 * SQUASH));
    if (rr < 0 || rr >= H) return -1;
    const cc = Math.round((mx - view.ox) / (view.s * SQ3) - 0.5 * (rr & 1));
    if (cc < 0 || cc >= W) return -1;
    const [x, y] = center(cc, rr);
    return Math.hypot(mx - x, my - y) < view.s * 1.05 ? idx(cc, rr) : -1;
  }
  canvas.addEventListener('click', (ev) => { const i = pick(ev); if (i >= 0) { sel = i; renderPanels(); } });
  canvas.addEventListener('mousemove', (ev) => { hov = pick(ev); });
  canvas.addEventListener('mouseleave', () => { hov = -1; });
  $('tPlay').addEventListener('click', () => {
    if (!playing && pos >= N - 1) { pos = 0; firedRev = 0; }
    playing = !playing;
    $('tPlay').textContent = playing ? '⏸' : '▶';
  });
  $('tStart').addEventListener('click', () => { pos = 0; firedRev = 0; $('nowplay').textContent = ''; renderPanels(); });
  $('tBack').addEventListener('click', () => {
    const atRest = frac() === 0;
    pos = atRest ? Math.max(0, Math.floor(pos) - 1) : Math.floor(pos);
    firedRev = rev(); renderPanels();
  });
  $('tFwd').addEventListener('click', () => {
    playing = false; $('tPlay').textContent = '▶';
    pos = Math.min(N - 1, Math.floor(pos) + 1); firedRev = rev();
    const r = rev();
    if (r > 0) $('nowplay').textContent = `#${r} ${(S.outcomes[r - 1] && S.outcomes[r - 1].summary) || ''}`;
    renderPanels();
  });
  $('speed').addEventListener('change', (ev) => { speed = Number(ev.target.value); });
  $('tMute').addEventListener('click', () => {
    muted = !muted;
    $('tMute').textContent = muted ? '🔇' : '🔊';
    if (!muted) sfx('click');
  });
  for (const id of ['tPlay', 'tStart', 'tBack', 'tFwd']) $(id).addEventListener('click', () => sfx('click'));
  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    for (const t of ['cell', 'build', 'city', 'log']) $('tab-' + t).hidden = t !== b.dataset.tab;
    const log = document.querySelector('#tab-log .log');
    if (b.dataset.tab === 'log' && log) log.scrollTop = log.scrollHeight;
  }));
  $('vFog').addEventListener('click', () => { fog = true; $('vFog').classList.add('on'); $('vFull').classList.remove('on'); renderPanels(); });
  $('vFull').addEventListener('click', () => { fog = false; $('vFull').classList.add('on'); $('vFog').classList.remove('on'); renderPanels(); });
  $('fine').textContent = 'Provenance: ' + S.meta.generatedBy + ' · ruleset standard v1 · ' +
    S.events.length + ' events · ' + N + ' keyframes (motion interpolates; all stops are genuine snapshots) · ' +
    'fog/memory recomputed by the real engine per keyframe · terrain, resources, units, counts genuine; soldier sprites, building tiles & herald lines are illustrative.';

  layout();
  renderPanels();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
