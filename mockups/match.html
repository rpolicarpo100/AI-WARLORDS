<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Warlords — Live Chronicle (MOCKUP · Age of Empires style)</title>
<style>
  :root {
    --gold:#e8c15a; --gold-dim:#8a6d2f; --ink:#f0e8d4; --dim:#b8ab8a;
    --stone1:#33383f; --stone2:#22262c; --stone3:#171b20;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; color:var(--ink); font:14px/1.45 system-ui,sans-serif;
    background:#0b0d10 radial-gradient(1200px 600px at 50% 0%, #1a2027, #0b0d10);
    display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  .display { font-family:Georgia,'Palatino Linotype','Times New Roman',serif; letter-spacing:2px; }
  .ribbon { background:repeating-linear-gradient(45deg,#3a2f10,#3a2f10 12px,#241f0a 12px,#241f0a 24px);
    color:var(--gold); text-align:center; padding:3px; font-size:11px; letter-spacing:2px; flex:none; }
  .topbar { display:flex; align-items:center; justify-content:center; gap:14px; padding:6px 12px;
    background:linear-gradient(#3a4048,#23272e); border-bottom:3px double var(--gold-dim); flex-wrap:wrap; flex:none; }
  .realm { font-size:18px; color:var(--gold); }
  .resbar { display:flex; gap:0; background:#101318; border:2px solid var(--gold-dim); border-radius:8px; overflow:hidden; }
  .resbar span { padding:5px 12px; border-left:1px solid #3a3f47; white-space:nowrap; }
  .resbar span:first-child { border-left:none; }
  .resbar b { color:var(--gold); }
  .age { background:#3d2f12; border:2px solid var(--gold-dim); border-radius:8px; padding:5px 12px; color:var(--gold); }
  .sbtn { background:linear-gradient(#4a5058,#2c3138); color:var(--ink); border:2px solid var(--gold-dim);
    border-radius:8px; padding:4px 12px; cursor:pointer; font-family:inherit; }
  .sbtn:hover { border-color:var(--gold); color:var(--gold); }
  .sbtn.on { background:var(--gold); color:#171204; font-weight:700; }
  .links a { color:var(--dim); font-size:12px; margin-left:8px; }
  /* ── Live transport ── */
  .transport { display:flex; align-items:center; gap:8px; padding:6px 14px;
    background:#141920; border-bottom:2px solid var(--gold-dim); flex-wrap:wrap; flex:none; }
  .live { display:inline-flex; align-items:center; gap:6px; font-weight:800; color:#ff6b6b; letter-spacing:2px; }
  .live i { width:10px; height:10px; border-radius:50%; background:#ff3b3b; animation:blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .tbtn { background:linear-gradient(#4a5058,#2c3138); color:var(--ink); border:2px solid var(--gold-dim);
    border-radius:8px; padding:3px 12px; cursor:pointer; font-size:15px; font-family:inherit; }
  .tbtn:hover { border-color:var(--gold); }
  #speed { background:#101318; color:var(--gold); border:2px solid var(--gold-dim); border-radius:8px; padding:3px 6px; font-family:inherit; }
  .progress { flex:1; min-width:200px; height:14px; background:#0a0d13; border:1px solid var(--gold-dim);
    border-radius:7px; position:relative; cursor:pointer; }
  .progress .fill { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,#7a5f1e,var(--gold));
    border-radius:6px; width:0; }
  .progress .stop { position:absolute; top:-3px; width:3px; height:18px; background:#4a5058; }
  .progress .stop.done { background:var(--gold); }
  #nowplay { color:var(--dim); font-size:12px; min-width:180px; }
  /* ── Isometric arena ── */
  .arena { flex:1; min-height:300px; position:relative; margin:8px 10px 0;
    border:3px double var(--gold-dim); border-radius:6px; overflow:hidden; background:#05070a; }
  #iso { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:pointer; }
  #floatlayer { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .floater { position:absolute; transform:translate(-50%,-100%); font:bold 15px Georgia,serif;
    color:var(--gold); text-shadow:0 2px 3px #000, 0 0 8px #000; white-space:nowrap;
    animation:rise 1.5s ease-out forwards; }
  .floater.big { font-size:19px; color:#ffe9a8; }
  @keyframes rise { 0% { opacity:0; margin-top:10px; } 15% { opacity:1; } 100% { opacity:0; margin-top:-46px; } }
  #herald { position:absolute; left:10px; bottom:8px; max-width:60%; background:rgba(10,12,16,.82);
    border:1px solid var(--gold-dim); border-radius:8px; padding:4px 12px; font:italic 13px Georgia,serif;
    color:var(--gold); pointer-events:none; }
  #statusline { font-size:12px; color:var(--dim); padding:5px 14px 0; flex:none; }
  #statusline b { color:var(--ink); }
  /* ── Dock ── */
  .dock { display:grid; grid-template-columns:190px minmax(0,1fr) 320px; gap:8px; padding:6px 10px 8px; flex:none; }
  .stone { background:linear-gradient(#2e333b,#1d2126); border:3px double var(--gold-dim);
    border-radius:8px; padding:8px; min-height:0; }
  .stone h4 { margin:0 0 6px; color:var(--gold); font-size:12px; letter-spacing:2px; }
  #mini { width:100%; display:block; border:2px solid #101318; border-radius:4px; }
  .tabs { display:flex; gap:6px; margin-bottom:6px; }
  .tabs button { flex:1; background:#101318; color:var(--dim); border:2px solid #3a3f47;
    border-radius:6px; padding:5px; cursor:pointer; font-family:Georgia,serif; letter-spacing:1px; }
  .tabs button.on { color:var(--gold); border-color:var(--gold-dim); }
  .card { background:#101318; border:1px solid #3a3f47; border-radius:6px; padding:6px 8px; margin-bottom:6px; }
  .card h5 { margin:0 0 4px; color:var(--gold); font-size:11px; letter-spacing:2px; }
  .brow { display:flex; justify-content:space-between; align-items:center; padding:3px 0; border-top:1px dotted #3a3f47; font-size:13px; }
  .brow:first-of-type { border-top:none; }
  .brow.now { background:#2a2410; margin:0 -8px; padding:3px 8px; }
  .cost { color:var(--dim); font-size:12px; }
  .afford { color:#7fd08f; } .poor { color:#e07f7f; }
  .qbar { height:8px; background:#2c3138; border-radius:4px; overflow:hidden; margin-top:3px; }
  .qbar i { display:block; height:100%; background:var(--gold); transition:width .8s ease; }
  .log { max-height:150px; overflow:auto; font-size:12px; }
  .log div { padding:2px 0; border-top:1px dotted #3a3f47; }
  .log .t { color:var(--dim); }
  .log div.fresh { animation:flash 1.6s ease; }
  @keyframes flash { 0% { background:#4a3f14; } 100% { background:transparent; } }
  .orders { max-height:168px; overflow:auto; }
  .order { display:flex; gap:8px; align-items:center; width:100%; text-align:left; background:#101318;
    color:var(--dim); border:1px solid #3a3f47; border-radius:6px; padding:4px 8px; margin-bottom:4px;
    cursor:pointer; font:12px system-ui,sans-serif; }
  .order:hover { border-color:var(--gold); color:var(--ink); }
  .order.done { color:var(--ink); }
  .order.done .n { background:#2c4a2c; border-color:#57a773; color:#cfd; }
  .order.now { border-color:var(--gold); background:#2a2410; color:var(--gold); }
  .order .n { background:#2c3138; border:1px solid #3a3f47; border-radius:4px; padding:0 6px; font-weight:700; }
  .fine { color:var(--dim); font-size:11px; padding:0 12px 8px; flex:none; }
  a { color:var(--gold); }
</style>

      ['town-center', 'house', 'storage', 'barracks', 'wall', 'tower'].map((b) => {
        const ok = Object.entries(bcfg[b].cost || {}).every(([t, v]) => (piles[t] || 0) >= v);
        const have = (st.buildings.buildings.p1[b] || 0);
        return `<div class="brow"><span>${BICON[b]} ${b} ×<b>${have}</b> <span class="cost">${Object.entries(bcfg[b].cost || {}).map(([t, v]) => `${RES[t]}${v}`).join(' ') || 'free'} · ${bcfg[b].buildTime}t</span></span>` +
        `<span class="${ok ? 'afford' : 'poor'}">${ok ? '✓' : '✗'}</span></div>`;
      }).join('') + '</div>';
    const city = st.cities && st.cities.cities.p1;
    $('tab-city').innerHTML = city ? `<div class="card"><h5>Thy city — level ${city.level}</h5>` +
      (city.queue.length ? city.queue.map((q) => {
        const total = bcfg[q.type].buildTime || 1;
        const done = 100 * (1 - q.remaining / total);
        return `<div>${BICON[q.type]} ${q.type} — ${q.remaining}t left<div class="qbar"><i style="width:${done}%"></i></div></div>`;
      }).join('') : '<div>Queue idle.</div>') + `<div style="margin-top:6px"><a href="city.html">open city view →</a></div></div>` : '<div class="card">No city.</div>';
    const evs = S.events.filter((e) => e.revision <= r);
    $('tab-log').innerHTML = `<div class="card log"><h5>Chronicle (real, ≤ order #${r})</h5>` +
      evs.map((e) => `<div class="${e.revision === r && r > 0 ? 'fresh' : ''}"><span class="t">#${e.seq} t${e.tick}</span> <b>${e.type}</b> ${esc(JSON.stringify(e.payload))}</div>`).join('') + '</div>';
    const T = { field:'#5d8a41', forest:'#2f5d33', mountain:'#8a8f98', river:'#3d6e9e', road:'#b0925e',
      bridge:'#7a5c3a', resource:'#6b6234', village:'#c9a86a', city:'#b03a3a' };
    let mh = '';
    for (const cell of st.map.cells) {
      const i = idx(cell.col, cell.row);
      const fill = (!fog || vis.has(i)) ? T[cell.terrain] : ((S.exploredBySnap[r] || []).includes(i) ? '#2a3446' : '#0a0c12');
      mh += `<rect x="${cell.col * 20}" y="${cell.row * 20}" width="19" height="19" fill="${fill}"/>`;
    }
    for (const u of (st.units ? st.units.units : [])) {
      const i = idx(u.col, u.row);
      if (fog && u.owner !== 'p1' && !vis.has(i)) continue;
      mh += `<circle cx="${u.col * 20 + 10}" cy="${u.row * 20 + 10}" r="4" fill="${u.owner === 'p1' ? '#3d7dd6' : '#d64545'}"/>`;
    }
    $('mini').innerHTML = mh;
    document.querySelectorAll('#orders .order').forEach((d) => {
      const k = Number(d.dataset.k);
      d.classList.toggle('now', k === r);
      d.classList.toggle('done', k < r);
    });
  }

  // ── Wiring ──
  const prog = $('prog');
  for (let i = 1; i < N; i++) {
    const d = document.createElement('div');
    d.className = 'stop'; d.style.left = (100 * i / (N - 1)) + '%';
    d.title = `#${i} ${(S.outcomes[i - 1] && S.outcomes[i - 1].summary) || ''}`;
    prog.appendChild(d);
  }
  prog.addEventListener('click', (ev) => {
    const rect = prog.getBoundingClientRect();
    const at = Math.round((ev.clientX - rect.left) / rect.width * (N - 1));
    pos = clamp(at, 0, N - 1);
    firedRev = rev();
    $('nowplay').textContent = pos === 0 ? '' : `#${rev()} ${(S.outcomes[rev() - 1] && S.outcomes[rev() - 1].summary) || ''}`;
    renderPanels();
  });
  const ordersEl = $('orders');
  S.outcomes.forEach((o, k) => {
    const b = document.createElement('button');
    b.className = 'order'; b.dataset.k = String(k + 1);
    b.innerHTML = `<span class="n">${k + 1}</span><span>${esc(o.summary || o.reason || o.status)} <span class="cost">· ${o.status}</span></span>`;
    b.addEventListener('click', () => {
      pos = k + 1; firedRev = rev();
      $('nowplay').textContent = `#${k + 1} ${esc(o.summary || '')}`;
      renderPanels();
    });
    ordersEl.appendChild(b);
  });
  function pick(ev) {
    const rect = canvas.getBoundingClientRect();
    const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    const rr = Math.round((my - view.oy) / (view.s * 1.5 * SQUASH));
    if (rr < 0 || rr >= H) return -1;
    const cc = Math.round((mx - view.ox) / (view.s * SQ3) - 0.5 * (rr & 1));
    if (cc < 0 || cc >= W) return -1;
    const [x, y] = center(cc, rr);
    return Math.hypot(mx - x, my - y) < view.s * 1.05 ? idx(cc, rr) : -1;
  }
  canvas.addEventListener('click', (ev) => { const i = pick(ev); if (i >= 0) { sel = i; renderPanels(); } });
  canvas.addEventListener('mousemove', (ev) => { hov = pick(ev); });
  canvas.addEventListener('mouseleave', () => { hov = -1; });
  $('tPlay').addEventListener('click', () => {
    if (!playing && pos >= N - 1) { pos = 0; firedRev = 0; }
    playing = !playing;
    $('tPlay').textContent = playing ? '⏸' : '▶';
  });
  $('tStart').addEventListener('click', () => { pos = 0; firedRev = 0; $('nowplay').textContent = ''; renderPanels(); });
  $('tBack').addEventListener('click', () => {
    const atRest = frac() === 0;
    pos = atRest ? Math.max(0, Math.floor(pos) - 1) : Math.floor(pos);
    firedRev = rev(); renderPanels();
  });
  $('tFwd').addEventListener('click', () => {
    playing = false; $('tPlay').textContent = '▶';
    pos = Math.min(N - 1, Math.floor(pos) + 1); firedRev = rev();
    const r = rev();
    if (r > 0) $('nowplay').textContent = `#${r} ${(S.outcomes[r - 1] && S.outcomes[r - 1].summary) || ''}`;
    renderPanels();
  });
  $('speed').addEventListener('change', (ev) => { speed = Number(ev.target.value); });
  $('tMute').addEventListener('click', () => {
    muted = !muted;
    $('tMute').textContent = muted ? '🔇' : '🔊';
    if (!muted) sfx('click');
  });
  for (const id of ['tPlay', 'tStart', 'tBack', 'tFwd']) $(id).addEventListener('click', () => sfx('click'));
  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    for (const t of ['cell', 'build', 'city', 'log']) $('tab-' + t).hidden = t !== b.dataset.tab;
    const log = document.querySelector('#tab-log .log');
    if (b.dataset.tab === 'log' && log) log.scrollTop = log.scrollHeight;
  }));
  $('vFog').addEventListener('click', () => { fog = true; $('vFog').classList.add('on'); $('vFull').classList.remove('on'); renderPanels(); });
  $('vFull').addEventListener('click', () => { fog = false; $('vFull').classList.add('on'); $('vFog').classList.remove('on'); renderPanels(); });
  $('fine').textContent = 'Provenance: ' + S.meta.generatedBy + ' · ruleset standard v1 · ' +
    S.events.length + ' events · ' + N + ' keyframes (motion interpolates; all stops are genuine snapshots) · ' +
    'fog/memory recomputed by the real engine per keyframe · terrain, resources, units, counts genuine; soldier sprites, building tiles & herald lines are illustrative. Kenney art (CC0, kenney.nl); windmill & wildlife are decorative ambience.';

  layout();
  renderPanels();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
